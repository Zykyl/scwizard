<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼컴 마법사의 여정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
            min-height: 500px;
        }

        /* ===== 게임 상태 ===== */
        .game-state-bar {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .state-item {
            flex: 1;
            min-width: 120px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .state-item.energy {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ffe5e5 0%, #ffcccc 100%);
        }

        .state-item.skill {
            border-color: #4ecdc4;
            background: linear-gradient(135deg, #e0f7f6 0%, #c0eeeb 100%);
        }

        .state-item.level {
            border-color: #ffd93d;
            background: linear-gradient(135deg, #fff8e1 0%, #ffe5b4 100%);
        }

        .state-item h3 {
            font-size: 0.85em;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .state-item .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #333;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4 0%, #44a08d 100%);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* ===== 메인 게임 화면 ===== */
        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        .character-zone {
            text-align: center;
            margin-bottom: 30px;
        }

        .character-display {
            font-size: 100px;
            animation: float 3s ease-in-out infinite;
            margin: 20px 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .stage-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .stage-description {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            margin-bottom: 25px;
            color: #333;
            line-height: 1.6;
            font-size: 1em;
        }

        .nickname-display {
            text-align: center;
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            background: #f0f7ff;
            padding: 10px;
            border-radius: 10px;
        }

        /* ===== 도전 과제 ===== */
        .challenge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .challenge-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .challenge-card:hover:not(.completed) {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.4);
        }

        .challenge-card.completed {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            opacity: 0.7;
            cursor: default;
        }

        .challenge-card.completed:hover {
            transform: none;
            box-shadow: none;
        }

        .challenge-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .challenge-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }

        .challenge-reward {
            font-size: 0.9em;
            opacity: 0.95;
            color: white;
        }

        .check-mark {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.8em;
            display: none;
        }

        .challenge-card.completed .check-mark {
            display: block;
        }

        /* ===== 미니게임 모달 ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.4);
            animation: popIn 0.3s ease;
            margin: auto;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-description {
            color: #555;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.6;
            font-size: 1em;
        }

        /* ===== 닉네임 입력 화면 ===== */
        .nickname-screen {
            text-align: center;
        }

        .nickname-screen h2 {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 20px;
        }

        .nickname-input-group {
            margin: 30px 0;
        }

        .nickname-input-group label {
            display: block;
            font-size: 1.2em;
            color: #555;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .nickname-input-group input {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nickname-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        /* ===== 게임 유형별 ===== */
        .quiz-container {
            margin-bottom: 20px;
        }

        .quiz-question {
            background: #f0f7ff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.1em;
            font-weight: bold;
            border-left: 4px solid #667eea;
        }

        .quiz-options {
            display: grid;
            gap: 12px;
        }

        .quiz-option {
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #333;
            font-weight: 500;
            font-size: 1em;
        }

        .quiz-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            color: #333;
        }

        .quiz-option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .sequence-game {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .sequence-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            border: 2px solid #ddd;
            padding: 12px 12px 12px 14px;
            border-radius: 10px;
            cursor: grab;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            font-weight: bold;
            text-align: left;
            color: #333;
            /* 터치 드래그 중 페이지 스크롤/텍스트 선택 방지 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .sequence-item:hover {
            border-color: #667eea;
            background: #f0f4ff;
            color: #333;
        }

        .sequence-item.dragging {
            cursor: grabbing;
            border-color: #667eea;
            background: #e3f2fd;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
            position: relative;
            z-index: 2;
        }

        .seq-handle {
            color: #999;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .seq-text {
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .seq-btns {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .seq-btns .seq-move {
            width: 40px;
            height: 40px;
            min-width: 0;
            flex: none;
            padding: 0;
            transition: background 0.2s ease;
            border-radius: 8px;
            background: #fff;
            border: 2px solid #ddd;
            color: #667eea;
            font-size: 1em;
            line-height: 1;
            box-shadow: none;
            transform: none;
            touch-action: manipulation;
        }

        .seq-btns .seq-move:disabled {
            opacity: 0.3;
            cursor: default;
        }

        /* ===== 버튼 ===== */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            color: #333;
        }

        /* ===== 리더보드 화면 ===== */
        .leaderboard-screen {
            text-align: center;
        }

        .leaderboard-title {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .leaderboard-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .leaderboard-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .leaderboard-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
        }

        .leaderboard-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            color: #333;
            text-align: left;
        }

        .leaderboard-table tbody tr:hover {
            background: #f0f7ff;
        }

        .rank-medal {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .rank-1 .rank-medal::before {
            content: '🥇';
        }

        .rank-2 .rank-medal::before {
            content: '🥈';
        }

        .rank-3 .rank-medal::before {
            content: '🥉';
        }

        .rank-medal {
            display: inline-block;
            width: 30px;
        }

        .player-name {
            font-weight: bold;
            color: #667eea;
        }

        .score-value {
            font-weight: bold;
            font-size: 1.1em;
            color: #764ba2;
        }

        .time-value {
            color: #666;
            font-size: 0.9em;
        }

        .leaderboard-info {
            color: #999;
            font-size: 0.85em;
            margin-top: 10px;
        }

        /* ===== 끝 화면 ===== */
        .ending-screen {
            text-align: center;
        }

        .master-title {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .achievement {
            background: linear-gradient(135deg, #ffd93d 0%, #ff9500 100%);
            padding: 25px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
        }

        .achievement-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            color: #1565c0;
            font-size: 0.95em;
        }

        .result-reward {
            background: linear-gradient(135deg, #ffd93d 0%, #ff9500 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 1.2em;
            font-weight: bold;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        /* ===== 초기 화면 리더보드 ===== */
        .nickname-leaderboard {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .nickname-leaderboard h3 {
            text-align: center;
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 20px;
        }

        .leaderboard-initial-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .leaderboard-initial-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .leaderboard-initial-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            font-size: 0.95em;
        }

        .leaderboard-initial-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .leaderboard-initial-table tbody tr:hover {
            background: #f8f9fa;
        }

        .leaderboard-initial-table tbody tr:nth-child(1) {
            background: #fffbf0;
            font-weight: bold;
        }

        .leaderboard-initial-table tbody tr:nth-child(2) {
            background: #f5f5f5;
        }

        .leaderboard-initial-table tbody tr:nth-child(3) {
            background: #fffaf0;
        }

        .rank-badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .rank-badge.rank-1 {
            background: linear-gradient(135deg, #ffd93d 0%, #ff9500 100%);
        }

        .rank-badge.rank-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #808080 100%);
        }

        .rank-badge.rank-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #8b5a00 100%);
        }

        /* ===== 반응형 ===== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .modal-content {
                padding: 25px;
            }

            .challenge-grid {
                grid-template-columns: 1fr;
            }

            .game-state-bar {
                flex-direction: column;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 10px;
                font-size: 0.9em;
            }

            .leaderboard-tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧙‍♂️ 슈퍼컴 마법사의 여정</h1>
            <p>재미있는 게임으로 슈퍼컴퓨터 마스터 되기!</p>
        </div>

        <div class="content">
            <!-- 닉네임 입력 화면 -->
            <div class="game-screen active" id="nicknameScreen">
                <div class="character-zone">
                    <div class="character-display">🧙‍♂️</div>
                </div>
                <div class="nickname-screen">
                    <h2>마법사의 이름을 지어주세요!</h2>
                    <p style="color: #666; margin-bottom: 30px; font-size: 1.1em;">
                        당신의 별칭을 입력하고 슈퍼컴 마스터의 여정을 시작하세요!
                    </p>
                    <div class="nickname-input-group">
                        <label for="nicknameInput">⭐ 당신의 별칭</label>
                        <input type="text" id="nicknameInput" placeholder="예: 슈퍼 마법사, 병렬처리 전사 등" maxlength="20">
                    </div>
                    <button class="btn-primary" onclick="game.startGameWithNickname()" style="width: 100%; max-width: 300px;">게임 시작</button>

                    <!-- 리더보드 표시 -->
                    <div class="nickname-leaderboard" id="initialLeaderboard">
                        <h3>🏆 현재 순위</h3>
                        <table class="leaderboard-initial-table" id="initialLeaderboardTable">
                            <thead>
                                <tr>
                                    <th style="width: 15%;">순위</th>
                                    <th style="width: 45%;">플레이어</th>
                                    <th style="width: 20%;">점수</th>
                                    <th style="width: 20%;">레벨</th>
                                </tr>
                            </thead>
                            <tbody id="initialLeaderboardBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: #999;">로딩 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 게임 상태 바 -->
            <div class="game-state-bar" id="stateBar" style="display: none;">
                <div class="state-item energy">
                    <h3>⚡ 에너지</h3>
                    <div class="value" id="energy">100</div>
                    <div class="bar">
                        <div class="bar-fill" id="energyBar" style="width: 100%"></div>
                    </div>
                </div>
                <div class="state-item skill">
                    <h3>🎓 실력</h3>
                    <div class="value" id="skill">0</div>
                    <div class="bar">
                        <div class="bar-fill" id="skillBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="state-item level">
                    <h3>🏆 레벨</h3>
                    <div class="value" id="level">1</div>
                </div>
            </div>

            <!-- 닉네임 표시 -->
            <div class="nickname-display" id="nicknameDisplay" style="display: none;"></div>

            <!-- 메인 게임 화면 -->
            <div class="game-screen" id="mainScreen">
                <div class="character-zone">
                    <div class="character-display" id="characterEmoji">🧙‍♂️</div>
                </div>

                <div class="stage-title" id="stageTitle">Stage 1: 슈퍼컴 기초 마법</div>

                <div class="stage-description" id="stageDescription">
                    슈퍼컴퓨터는 생각보다 훨씬 쉬워요!
                    다양한 도전 과제를 완료하면서 마법 실력을 키워보세요.
                    각 도전 과제를 클릭해서 게임을 시작하세요! 🎮
                </div>

                <div class="challenge-grid" id="challengeGrid"></div>

                <div class="button-group">
                    <button class="btn-secondary" onclick="game.showStats()">📊 내 성적 보기</button>
                    <button class="btn-primary" onclick="game.showLeaderboard()">🏆 리더보드</button>
                </div>
            </div>

            <!-- 게임 모달 -->
            <div class="modal" id="gameModal">
                <div class="modal-content">
                    <div id="gameContent"></div>
                </div>
            </div>

            <!-- 리더보드 모달 -->
            <div class="modal" id="leaderboardModal">
                <div class="modal-content">
                    <div id="leaderboardContent"></div>

            completedChallenges: new Set(),
            totalPoints: 0,
            challengeTimes: {},

        };

        let localLeaderboard = (() => { try { const d = JSON.parse(localStorage.getItem('supercomLeaderboard')); return Array.isArray(d) ? d : []; } catch (e) { return []; } })();
        let sharedLeaderboard = [];

        // 게임 객체
        const game = {
            firebase: null,          // { db, fs } - 초기화 후 채워짐
            liveReady: null,         // 첫 실시간 스냅샷을 기다리는 Promise
            leaderboardTab: 'combined',

            // Firebase SDK를 필요할 때 불러와 초기화
            async initFirebase() {
                if (!FIREBASE_ENABLED) return null;
                if (this.firebase) return this.firebase;
                const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}`;
                const [{ initializeApp }, fs] = await Promise.all([
                    import(`${base}/firebase-app.js`),
                    import(`${base}/firebase-firestore.js`)
                ]);
                const app = initializeApp(FIREBASE_CONFIG);
                this.firebase = { db: fs.getFirestore(app), fs };
                return this.firebase;
            },

            // Firestore 문서를 화면용 기록으로 정리 (잘못된 값 차단)
            normalizeEntry(d) {
                if (!d || typeof d.score !== 'number') return null;
                return {
                    nickname: String(d.nickname ?? '').slice(0, 20),
                    score: d.score,
                    level: Number(d.level) || 1,
                    time: Number(d.time) || 0,
                    date: String(d.date ?? ''),
                    // 등록 시각: Firestore 서버 시각 (등록 직후 아직 없으면 지금 시각)
                    ts: d.createdAt?.toMillis?.() ?? (Number(d.ts) || Date.now())
                };
            },

            // 관리자 초기화 이후 기록만 남기기
            afterReset(board) {
                return leaderboardResetAt ? board.filter(p => (p.ts || 0) >= leaderboardResetAt) : board;
            },

            // 관리자가 리더보드를 초기화하면 이 브라우저의 로컬 기록도 함께 정리
            applyReset(resetAt) {
                leaderboardResetAt = resetAt || 0;
                const kept = this.afterReset(localLeaderboard);
                if (kept.length !== localLeaderboard.length) {
                    localLeaderboard = kept;
                    try { localStorage.setItem('supercomLeaderboard', JSON.stringify(localLeaderboard)); } catch (e) {}
                }
                sharedLeaderboard = this.afterReset(sharedLeaderboard);
            },

            // 실시간 리더보드 구독: 누가 기록을 올리면 즉시 화면이 갱신됨
            startLiveLeaderboard() {
                if (this.liveReady) return this.liveReady;
                this.liveReady = new Promise(resolve => {
                    this.initFirebase().then(({ db, fs }) => {
                        // 관리자 초기화 시각 구독
                        fs.onSnapshot(fs.doc(db, ...FIREBASE_META_DOC), snap => {
                            this.applyReset(snap.data()?.resetAt?.toMillis?.() || 0);
                            this.refreshLeaderboardViews();
                        }, error => console.log('리더보드 설정 구독 실패:', error));

                        const q = fs.query(fs.collection(db, FIREBASE_COLLECTION), fs.orderBy('score', 'desc'), fs.limit(100));
                        fs.onSnapshot(q, snap => {
                            sharedLeaderboard = this.afterReset(snap.docs.map(doc => this.normalizeEntry(doc.data())).filter(Boolean));
                            this.refreshLeaderboardViews();
                            resolve();
                        }, error => {
                            console.log('실시간 리더보드 구독 실패:', error);
                            resolve();
                        });
                    }).catch(error => {
                        console.log('Firebase 초기화 실패:', error);
                        resolve();
                    });
                });
                return this.liveReady;
            },

            async loadSharedLeaderboard() {
                if (FIREBASE_ENABLED) {
                    await this.startLiveLeaderboard();
                    return sharedLeaderboard;
                }

                if (!SHARED_LEADERBOARD_URL) return [];

                try {
                    // 캐시된 예전 파일이 아닌 최신 파일을 받도록 쿼리 추가
                    const url = SHARED_LEADERBOARD_URL + (SHARED_LEADERBOARD_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
                    const response = await fetch(url, { cache: 'no-store' });
                    if (response.ok) {
                        const data = await response.json();
                        // 형식: 기록 배열 또는 { resetAt, entries } (GitHub Actions 초기화 버튼이 resetAt 기록)
                        const entries = Array.isArray(data) ? data : (Array.isArray(data?.entries) ? data.entries : []);
                        const resetAt = Date.parse(data?.resetAt) || 0;
                        if (resetAt) this.applyReset(resetAt);
                        return this.afterReset(entries.map(d => this.normalizeEntry(d)).filter(Boolean));
                    }
                } catch (error) {
                    console.log('공유 리더보드 로드 실패:', error);
                }
                return [];
            },

            // 게임 기록을 Firebase 공유 리더보드에 등록
            async submitScore(entry) {
                if (!FIREBASE_ENABLED) return false;
                try {
                    const { db, fs } = await this.initFirebase();
                    await fs.addDoc(fs.collection(db, FIREBASE_COLLECTION), {
                        nickname: entry.nickname,
                        score: entry.score,
                        level: entry.level,
                        time: entry.time,
                        date: entry.date,
                        createdAt: fs.serverTimestamp()
                    });
                    return true;
                } catch (error) {
                    console.log('공유 리더보드 등록 실패:', error);
                    return false;
                }
            },

            // 열려 있는 순위표를 최신 데이터로 다시 그림
            refreshLeaderboardViews() {
                this.loadInitialLeaderboard(false);
                if (document.getElementById('leaderboardModal')?.classList.contains('active')) {
                    this.renderLeaderboardModal();
                }
            },

            // HTML 이스케이프 (닉네임에 태그가 들어가도 화면이 깨지지 않도록)
            escapeHtml(str) {
                return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            },

            // 로컬 + 공유 기록 합치기 (같은 기록 중복 제거)
            mergeLeaderboards(...boards) {
                const seen = new Set();
                const merged = [];
                boards.flat().forEach(p => {
                    if (!p || typeof p.score !== 'number') return;
                    const key = `${p.nickname}|${p.score}|${Math.round(p.time || 0)}`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    merged.push(p);
                });
                return merged.sort((a, b) => b.score - a.score || (a.time || 0) - (b.time || 0));
            },

            // 초기 리더보드 로드 (게임 시작 전) - 실제 로컬/공유 기록으로 갱신
            async loadInitialLeaderboard(fetchShared = true) {
                const leaderboardBody = document.getElementById('initialLeaderboardBody');
                if (!leaderboardBody) return;

                // 공유 기록을 받기 전에 로컬 기록부터 먼저 표시
                const render = (data) => {
                    if (data.length === 0) {
                        leaderboardBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #999;">아직 기록이 없습니다.</td></tr>`;
                        return;
                    }
                    let html = '';
                    data.slice(0, 5).forEach((player, idx) => {
                        const rankNum = idx + 1;
                        let rankClass = '';
                        if (rankNum === 1) rankClass = 'rank-1';
                        else if (rankNum === 2) rankClass = 'rank-2';
                        else if (rankNum === 3) rankClass = 'rank-3';

                        html += `
                            <tr>
                                <td><span class="rank-badge ${rankClass}">${rankNum}</span></td>
                                <td><strong>${this.escapeHtml(player.nickname)}</strong></td>
                                <td>${player.score} 점</td>
                                <td>Lv.${player.level}</td>
                            </tr>
                        `;
                    });
                    leaderboardBody.innerHTML = html;
                };

                render(this.mergeLeaderboards(localLeaderboard, sharedLeaderboard));
                if (!fetchShared) return;
                sharedLeaderboard = await this.loadSharedLeaderboard();
                render(this.mergeLeaderboards(localLeaderboard, sharedLeaderboard));
            },

            startGameWithNickname() {

                const nickname = nicknameInput.value.trim();

                document.getElementById('nicknameDisplay').textContent = `🧙 ${nickname}의 슈퍼컴 마법 여정`;

            },

            startChallenge(challengeId) {
                const challenge = this.findChallenge(challengeId);
                if (!challenge || gameState.completedChallenges.has(challengeId)) return;

                if (!gameState.attempts[challengeId]) {
                    gameState.attempts[challengeId] = 0;

                gameState.challengeTimes[challengeId] = {

                };

                const modal = document.getElementById('gameModal');

                if (challenge.type === 'quiz') {

            showQuiz(challenge, container) {

                `;

            // 보기 순서를 섞어서 표시 (위치를 외워서 푸는 것 방지)
            renderQuizOptions() {
                const challenge = window.currentQuizChallenge;
                const box = document.getElementById('quizOptions');
                if (!challenge || !box) return;

                const options = this.shuffleDifferent(challenge.data.options, window.currentQuizOptions);
                window.currentQuizOptions = options;

                box.innerHTML = options.map((opt, idx) => `

                document.querySelector(`[data-index="${idx}"]`).classList.add('selected');

            submitQuiz() {
                const selected = window.selectedQuizAnswer;
                const challenge = window.currentQuizChallenge;
                const options = window.currentQuizOptions;

                if (selected === undefined) {
                    alert('답을 선택해주세요!');
                    return;
                }

                gameState.attempts[challenge.id]++;

                if (options[selected].correct) {
                    this.completeChallenge(challenge.id);
                } else {
                    // 감점 처리
                    const penalty = Math.floor(challenge.penalty * gameState.attempts[challenge.id] * 0.5);
                    gameState.energy = Math.max(0, gameState.energy - penalty);
                    this.updateUI();
                    alert(`❌ 틀렸어요! -${penalty} 에너지 손실\n보기 순서가 바뀌었어요. 다시 시도해보세요! (${gameState.attempts[challenge.id]}회 시도)`);
                    this.renderQuizOptions();
                }
            },

            // Fisher-Yates 셔플 알고리즘
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            // 이전 순서(avoid)와 다른 순서가 나오도록 섞기 (보기가 2개 이상일 때)
            shuffleDifferent(array, avoid) {
                const same = (a, b) => b && a.length === b.length && a.every((v, i) => v === b[i]);
                let shuffled = this.shuffleArray(array);
                for (let tries = 0; tries < 10 && array.length > 1 && same(shuffled, avoid); tries++) {
                    shuffled = this.shuffleArray(array);
                }
                return shuffled;
            },

            showSequence(challenge, container) {
                const data = challenge.data;
                // 정답 선택지를 매번 섞기
                // 처음부터 정답 순서로 나오지 않도록 섞기
                const shuffledItems = this.shuffleDifferent(data.items, data.items);
                window.currentSequenceChallenge = challenge;
                window.originalSequenceOrder = data.items;

                const html = `
                    <div class="modal-title">${challenge.name}</div>
                    <div style="margin: 20px 0;">
                        <p style="color: #555; margin-bottom: 15px; text-align: left; font-weight: bold;">👇 아래 항목들을 드래그하거나 ▲▼ 버튼으로 순서대로 정렬하세요!</p>
                        <div class="sequence-game" id="sequenceItems">
                            ${shuffledItems.map((item, idx) => `
                                <div class="sequence-item" data-original="${data.items.indexOf(item)}">
                                    <span class="seq-handle" aria-hidden="true">☰</span>
                                    <span class="seq-text">${item}</span>
                                    <span class="seq-btns">
                                        <button type="button" class="seq-move" data-dir="-1" aria-label="위로">▲</button>
                                        <button type="button" class="seq-move" data-dir="1" aria-label="아래로">▼</button>
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary" onclick="game.submitSequence('${challenge.id}')">완료!</button>
                        <button class="btn-secondary" onclick="game.closeModal()">취소</button>
                    </div>
                `;
                container.innerHTML = html;
                this.initSequenceSort(document.getElementById('sequenceItems'));
            },

            // 마우스·터치 공통 드래그 정렬 (Pointer Events) + ▲▼ 버튼
            initSequenceSort(list) {
                if (!list) return;
                const scroller = document.getElementById('gameModal');
                const updateButtons = () => {
                    const items = [...list.children];
                    items.forEach((el, i) => {
                        el.querySelector('[data-dir="-1"]').disabled = i === 0;
                        el.querySelector('[data-dir="1"]').disabled = i === items.length - 1;
                    });
                };
                updateButtons();

                list.addEventListener('click', e => {
                    const btn = e.target.closest('.seq-move');
                    if (!btn) return;
                    const item = btn.closest('.sequence-item');
                    if (btn.dataset.dir === '-1' && item.previousElementSibling) {
                        list.insertBefore(item, item.previousElementSibling);
                    } else if (btn.dataset.dir === '1' && item.nextElementSibling) {
                        list.insertBefore(item.nextElementSibling, item);
                    }
                    updateButtons();
                });

                let drag = null;

                const moveTo = (clientY) => {
                    const { item } = drag;
                    // 손가락 위치에 맞춰 항목을 형제 사이로 이동
                    const siblings = [...list.children].filter(el => el !== item);
                    const before = siblings.find(el => {
                        const r = el.getBoundingClientRect();
                        return clientY < r.top + r.height / 2;
                    });
                    const firstTop = item.getBoundingClientRect().top;
                    if (before) {
                        if (item.nextElementSibling !== before) list.insertBefore(item, before);
                    } else if (list.lastElementChild !== item) {
                        list.appendChild(item);
                    }
                    // DOM 이동으로 생긴 위치 변화를 보정해 항목이 손가락을 따라다니게 함
                    drag.baseOffset += item.getBoundingClientRect().top - firstTop;
                    item.style.transform = `translateY(${clientY - drag.startY - drag.baseOffset}px)`;
                };

                const autoScroll = () => {
                    if (!drag) return;
                    const edge = 60;
                    const h = window.innerHeight;
                    let dy = 0;
                    if (drag.lastY < edge) dy = -8;
                    else if (drag.lastY > h - edge) dy = 8;
                    if (dy) {
                        const before = scroller.scrollTop;
                        scroller.scrollTop += dy;
                        const moved = scroller.scrollTop - before;
                        if (moved) {
                            drag.startY -= moved;
                            moveTo(drag.lastY);
                        }
                    }
                    drag.raf = requestAnimationFrame(autoScroll);
                };

                list.addEventListener('pointerdown', e => {
                    if (e.button !== 0 || e.target.closest('.seq-move')) return;
                    const item = e.target.closest('.sequence-item');
                    if (!item) return;
                    e.preventDefault();
                    item.setPointerCapture(e.pointerId);
                    item.classList.add('dragging');
                    drag = { item, pointerId: e.pointerId, startY: e.clientY, lastY: e.clientY, baseOffset: 0, raf: 0 };
                    drag.raf = requestAnimationFrame(autoScroll);
                });

                list.addEventListener('pointermove', e => {
                    if (!drag || e.pointerId !== drag.pointerId) return;
                    e.preventDefault();
                    drag.lastY = e.clientY;
                    moveTo(e.clientY);
                });

                const endDrag = e => {
                    if (!drag || e.pointerId !== drag.pointerId) return;
                    cancelAnimationFrame(drag.raf);
                    drag.item.classList.remove('dragging');
                    drag.item.style.transform = '';
                    drag = null;
                    updateButtons();
                };
                list.addEventListener('pointerup', endDrag);
                list.addEventListener('pointercancel', endDrag);
            },

            submitSequence(challengeId) {
                const items = document.querySelectorAll('.sequence-item');
                let isCorrect = true;

                items.forEach((item, idx) => {
                    if (parseInt(item.dataset.original) !== idx) {
                        isCorrect = false;
                    }
                });

                gameState.attempts[challengeId]++;

                if (isCorrect) {
                    alert('✅ 완벽합니다! 순서가 정확해요!');
                    this.completeChallenge(challengeId);
                } else {
                    const challenge = this.findChallenge(challengeId);
                    const penalty = Math.floor(challenge.penalty * gameState.attempts[challengeId] * 0.5);
                    gameState.energy = Math.max(0, gameState.energy - penalty);
                    this.updateUI();
                    alert(`❌ 순서가 다릅니다! -${penalty} 에너지 손실\n다시 한번 정렬해보세요! (${gameState.attempts[challengeId]}회 시도)`);
                }
            },

            closeModal() {
                document.getElementById('gameModal').classList.remove('active');
            },

            findChallenge(id) {
                for (let stage of stages) {
                    const challenge = stage.challenges.find(c => c.id === id);
                    if (challenge) return challenge;
                }
                return null;
            },

            completeChallenge(challengeId) {
                if (gameState.completedChallenges.has(challengeId)) return;

                const challenge = this.findChallenge(challengeId);
                const timeTaken = (Date.now() - gameState.challengeTimes[challengeId].startTime) / 1000;
                gameState.challengeTimes[challengeId].time = timeTaken;

                // 시간 보너스 계산
                let finalReward = challenge.reward;
                if (timeTaken < challenge.maxTime) {
                    const bonusRatio = (challenge.maxTime - timeTaken) / challenge.maxTime * 0.5;
                    finalReward = Math.round(challenge.reward * (1 + bonusRatio));
                }

                gameState.completedChallenges.add(challengeId);
                gameState.skill += finalReward;
                gameState.totalPoints += finalReward;

                // 레벨 업
                if (gameState.skill >= gameState.level * 50) {
                    gameState.level++;
                    gameState.energy = Math.min(100, gameState.energy + 20);
                    alert(`🎉 레벨 ${gameState.level}로 업그레이드! 에너지 회복!`);
                }

                this.updateUI();
                this.closeModal();
                alert(`🎉 도전 완료! +${finalReward} 실력 획득! (기본: ${challenge.reward}, 시간 보너스 포함)`);

                // 모든 스테이지 완료 확인
                if (gameState.completedChallenges.size === this.getTotalChallenges()) {
                    setTimeout(() => this.showEnding(), 300);
                }
            },

            getTotalChallenges() {
                return stages.reduce((sum, stage) => sum + stage.challenges.length, 0);
            },

            updateUI() {
                document.getElementById('energy').textContent = gameState.energy;
                document.getElementById('skill').textContent = gameState.skill;
                document.getElementById('level').textContent = gameState.level;
                document.getElementById('energyBar').style.width = gameState.energy + '%';
                document.getElementById('skillBar').style.width = Math.min(100, (gameState.skill % 50) * 2) + '%';

                const stage = stages[gameState.currentStage];
                const challengeGrid = document.getElementById('challengeGrid');

                document.getElementById('characterEmoji').textContent = stage.emoji;
                document.getElementById('stageTitle').textContent = stage.name;

                challengeGrid.innerHTML = stage.challenges.map(challenge => `
                    <div class="challenge-card ${gameState.completedChallenges.has(challenge.id) ? 'completed' : ''}"
                         onclick="game.startChallenge('${challenge.id}')" style="cursor: ${gameState.completedChallenges.has(challenge.id) ? 'default' : 'pointer'}">
                        <div class="check-mark">✅</div>
                        <div class="challenge-icon">${challenge.icon}</div>
                        <div class="challenge-name">${challenge.name}</div>
                        <div class="challenge-reward">+${challenge.reward}</div>
                    </div>
                `).join('');

                // 다음 스테이지 진행
                if (stage.challenges.every(c => gameState.completedChallenges.has(c.id))) {
                    if (gameState.currentStage < stages.length - 1) {
                        gameState.currentStage++;
                        this.updateUI();
                    }
                }
            },

            showStats() {
                const completed = gameState.completedChallenges.size;
                const total = this.getTotalChallenges();
                const percentage = Math.round((completed / total) * 100);
                const playTime = Math.round((Date.now() - gameState.startTime) / 1000);
                alert(`📊 현재 성적\n\n완료한 도전: ${completed}/${total}\n획득 실력: ${gameState.skill}\n레벨: ${gameState.level}\n진행도: ${percentage}%\n플레이 시간: ${playTime}초\n에너지: ${gameState.energy}`);
            },

                    totalPoints: 0,
                    challengeTimes: {},
                    startTime: null,
                    attempts: {}
                };

                document.getElementById('gameModal').classList.remove('active');
                document.getElementById('mainScreen').classList.remove('active');
                document.getElementById('stateBar').style.display = 'none';
                document.getElementById('nicknameDisplay').style.display = 'none';
                document.getElementById('nicknameInput').value = '';
                document.getElementById('nicknameScreen').classList.add('active');

                // 초기 리더보드 다시 로드
                game.loadInitialLeaderboard();
            }
        };

        // 페이지 로드 시 초기 리더보드 표시
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => game.loadInitialLeaderboard());
        } else {
            game.loadInitialLeaderboard();
        }
    </script>
</body>
</html>
