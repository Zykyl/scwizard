# 리더보드 초기화 버튼
# GitHub 저장소 > Actions > "리더보드 초기화" > Run workflow 를 누르면 실행됩니다.
# 저장소 쓰기 권한이 있는 사람만 실행할 수 있습니다.
name: 리더보드 초기화

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '초기화하려면 "초기화" 를 입력하세요'
        required: true
        default: ''

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: 확인 문구 검사
        if: ${{ github.event.inputs.confirm != '초기화' }}
        run: |
          echo '::error::확인 문구가 일치하지 않아 초기화하지 않았습니다. "초기화" 를 입력해주세요.'
          exit 1

      - uses: actions/checkout@v4

      - name: leaderboard.json 초기화
        run: |
          node -e '
            const fs = require("fs");
            const data = { resetAt: new Date().toISOString(), entries: [] };
            fs.writeFileSync("leaderboard.json", JSON.stringify(data, null, 2) + "\n");
            console.log("초기화 시각:", data.resetAt);
          '

      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git commit -m "Reset leaderboard (${{ github.actor }})"
          git push
